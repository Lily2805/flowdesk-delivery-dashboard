<style>
:root{--blue:#2563eb;--blue2:#4f8cff;--navy:#0f172a;--muted:#64748b;--line:#e5edf8;--bg:#f5f8ff;--card:#fff;--green:#16a34a;--amber:#d97706;--red:#dc2626;--purple:#7c3aed;--shadow:0 14px 40px rgba(37,99,235,.08);--radius:20px}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy);background:linear-gradient(180deg,#f7faff 0,#f5f8ff 100%)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:248px;background:#fff;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:10px;padding:5px 10px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#72a1ff);display:grid;place-items:center;color:white;font-weight:900;box-shadow:0 8px 18px #2563eb35}.brand b{font-size:17px}.brand span{font-size:11px;color:#8a9ab2;display:block}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:left;padding:11px 12px;border-radius:12px;color:#66768d;display:flex;align-items:center;gap:11px}.nav button.active,.nav button:hover{background:#eef5ff;color:var(--blue);font-weight:700}.side-foot{margin-top:auto;background:#f4f8ff;border:1px solid #e0ebff;padding:14px;border-radius:16px}.side-foot small{color:var(--muted)}.side-foot b{display:block;margin-top:4px}.main{flex:1;min-width:0}.topbar{height:76px;background:#ffffffcc;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--navy)}.actions{display:flex;align-items:center;gap:10px}.search{width:260px;background:#f7f9fd;border:1px solid var(--line);border-radius:12px;padding:10px 13px;outline:none}.search:focus{border-color:#9bbcff;box-shadow:0 0 0 4px #2563eb12}.btn{padding:10px 14px;border-radius:12px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--navy)}.btn.primary{background:var(--blue);color:white;border-color:var(--blue);box-shadow:0 8px 18px #2563eb28}.btn.ghost{background:#eef5ff;color:var(--blue);border-color:#d9e7ff}.content{padding:28px 30px 60px;max-width:1500px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.hero h1{font-size:30px;letter-spacing:-1px;margin:0 0 7px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.stat .label{font-size:12px;color:var(--muted);font-weight:700}.stat .num{font-size:29px;font-weight:850;margin-top:8px}.stat .delta{font-size:11px;margin-top:5px;color:var(--green)}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.card-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.card-head h3{margin:0;font-size:15px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8a99ad;text-align:left;padding:13px 16px;background:#fbfcff}.table td{padding:14px 16px;border-top:1px solid #eef2f7;font-size:13px;vertical-align:middle}.project-name{font-weight:800}.sub{font-size:11px;color:#8794a8;margin-top:4px}.status{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status.on{background:#eaf8ef;color:var(--green)}.status.blocked{background:#fff0f0;color:var(--red)}.status.progress{background:#eef5ff;color:var(--blue)}.status.review{background:#fff8e8;color:var(--amber)}.status.not{background:#f1f4f8;color:#64748b}.avatars{display:flex}.avatar{width:28px;height:28px;border-radius:50%;background:#e7efff;border:2px solid white;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--blue);margin-left:-6px}.avatar:first-child{margin-left:0}.row-btn{background:none;color:var(--blue);font-weight:800}.progressbar{height:7px;background:#edf2f8;border-radius:10px;overflow:hidden;width:120px}.progressbar i{height:100%;display:block;background:linear-gradient(90deg,#2563eb,#70a0ff);border-radius:10px}.activity{padding:16px 20px;display:grid;gap:14px}.activity-item{display:grid;grid-template-columns:28px 1fr auto;gap:11px}.dot{width:28px;height:28px;border-radius:10px;background:#eef5ff;color:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:900}.activity-item b{font-size:12px}.activity-item p{margin:3px 0 0;color:#6b7b90;font-size:12px;line-height:1.45}.time{font-size:10px;color:#9aa6b7}.page{display:none}.page.active{display:block}.detail-grid{display:grid;grid-template-columns:1.65fr .9fr;gap:18px}.project-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.back{color:var(--blue);font-weight:800;background:none;padding:0;margin-bottom:10px}.project-title{display:flex;align-items:center;gap:10px}.project-title h1{margin:0;font-size:28px}.meta{display:flex;gap:15px;color:var(--muted);font-size:12px;margin-top:8px;flex-wrap:wrap}.tabs{display:flex;gap:4px;background:#eef3fb;padding:4px;border-radius:12px;margin-bottom:16px}.tab{padding:9px 13px;border-radius:9px;background:transparent;color:#6a7890;font-weight:700;font-size:12px}.tab.active{background:white;color:var(--blue);box-shadow:0 2px 8px #1d4ed80f}.milestone{padding:16px 18px;border-bottom:1px solid var(--line)}.milestone:last-child{border-bottom:0}.mile-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.mile-name{font-weight:800;font-size:13px}.task{display:grid;grid-template-columns:20px 1fr auto;gap:9px;align-items:center;padding:9px 0 0 25px}.check{width:17px;height:17px;border-radius:5px;border:1.5px solid #b8c7dc;background:#fff;display:grid;place-items:center;color:white;font-size:10px}.check.done{background:var(--green);border-color:var(--green)}.task span{font-size:12px}.task .owner{color:#8b98aa;font-size:10px}.issue{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:13px 18px;border-bottom:1px solid #eef2f7}.issue:last-child{border-bottom:0}.tag{font-size:10px;padding:5px 7px;border-radius:8px;background:#f1f5ff;color:var(--blue);font-weight:800}.tag.bug{background:#fff0f0;color:var(--red)}.tag.feature{background:#f1edff;color:var(--purple)}.tag.question{background:#fff8e8;color:var(--amber)}.tag.support{background:#eaf8ef;color:var(--green)}.feed{display:grid;gap:12px;padding:16px}.feed-item{background:#f8fbff;border:1px solid #e5eefb;border-radius:15px;padding:13px}.feed-top{display:flex;justify-content:space-between;font-size:11px}.feed-top b{color:#334155}.feed-item p{font-size:12px;color:#53647a;line-height:1.5;margin:7px 0}.structured{display:flex;gap:6px;flex-wrap:wrap}.mini{font-size:10px;background:white;border:1px solid #dfe8f5;padding:4px 6px;border-radius:7px;color:#63738a}.customer-banner{background:linear-gradient(120deg,#0f5bea,#4c8dff);color:white;padding:16px 18px;border-radius:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}.customer-banner small{opacity:.82}.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.column{background:#f7f9fd;border:1px solid var(--line);border-radius:16px;padding:12px;min-height:350px}.column h4{font-size:12px;margin:2px 3px 10px}.kcard{background:white;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px;box-shadow:0 5px 14px #19366c08}.kcard b{font-size:12px}.kcard p{font-size:10px;color:#8390a1;margin:6px 0}.query{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;gap:9px}.query input{flex:1;border:0;outline:0}.modal{position:fixed;inset:0;background:#0f172a55;display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.modal.show{display:flex}.modal-box{background:#fff;border-radius:22px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px #0f172a35}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:20px;display:grid;gap:14px}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:800;color:#607087}.field input,.field select,.field textarea{border:1px solid #dce5f2;border-radius:11px;padding:10px;outline:none}.field textarea{min-height:100px;resize:vertical}.modal-actions{padding:0 20px 20px;display:flex;justify-content:flex-end;gap:8px}.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}.toast{position:fixed;right:22px;bottom:22px;background:#0f172a;color:#fff;padding:12px 15px;border-radius:12px;font-size:12px;box-shadow:0 14px 40px #0f172a33;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s;z-index:200}.toast.show{opacity:1;transform:none}.doc{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}.doc-icon{width:32px;height:32px;background:#eef5ff;color:var(--blue);display:grid;place-items:center;border-radius:9px;font-weight:900}.muted{color:var(--muted)}.pill{font-size:10px;padding:4px 7px;border-radius:999px;background:#eef5ff;color:var(--blue);font-weight:800}.toggle{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
@media(max-width:1050px){.sidebar{width:210px}.stats{grid-template-columns:repeat(2,1fr)}.grid,.detail-grid{grid-template-columns:1fr}.search{width:180px}}@media(max-width:760px){.sidebar{display:none}.content{padding:20px 14px}.topbar{padding:0 14px}.search{display:none}.stats{grid-template-columns:1fr 1fr}.hero{align-items:flex-start;flex-direction:column}.kanban{grid-template-columns:1fr}.table th:nth-child(3),.table td:nth-child(3){display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="logo">F</div><div><b>FlowDesk</b><span>Delivery command center</span></div></div>
 <nav class="nav">
  <button class="active" data-page="overview">◫ <span>Overview</span></button>
  <button data-page="projects">▦ <span>Projects</span></button>
  <button data-page="kanban">▤ <span>Kanban</span></button>
  <button data-page="activity">◉ <span>Activity</span></button>
  <button data-page="insights">⌁ <span>AI Insights</span></button>
 </nav>
 <div class="side-foot"><small>Workspace</small><b>FlytBase Delivery</b><small>Demo mode · local data</small></div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb" id="crumb">Workspace / <b>Overview</b></div><div id="apiStatus" style="font-size:11px;font-weight:700;color:#64748b;margin-left:18px">Connecting…</div><div class="actions"><input id="globalSearch" class="search" placeholder="Search projects, owners…"/><button class="btn ghost" onclick="seedReset()">Reset demo</button><button class="btn primary" onclick="openProjectModal()">+ New project</button></div></header>
<div class="content">
<section id="page-overview" class="page active"></section>
<section id="page-projects" class="page"></section>
<section id="page-kanban" class="page"></section>
<section id="page-activity" class="page"></section>
<section id="page-insights" class="page"></section>
<section id="page-detail" class="page"></section>
</div>
</main></div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='flowdesk_demo_v1';
const people=['Aarav','Maya','Rohan','Ishita','Kabir','Neha'];
const seed={projects:[
{id:'PRJ-101',name:'SkyGrid Logistics',customer:'SkyGrid Logistics',owners:['Aarav','Maya'],status:'On track',health:'Good',start:'2026-07-02',due:'2026-08-28',updated:'2026-08-15T09:20',milestones:[{id:'M1',name:'Discovery & Solution Design',due:'2026-07-12',tasks:[{id:'T1',name:'Kickoff completed',owner:'Aarav',status:'Done'},{id:'T2',name:'Solution architecture approved',owner:'Maya',status:'Done'}]},{id:'M2',name:'Implementation',due:'2026-08-20',tasks:[{id:'T3',name:'Drone fleet configuration',owner:'Rohan',status:'Done'},{id:'T4',name:'API integration',owner:'Maya',status:'In progress'},{id:'T5',name:'UAT environment ready',owner:'Kabir',status:'Open'}]},{id:'M3',name:'Go-live',due:'2026-08-28',tasks:[{id:'T6',name:'Customer training',owner:'Aarav',status:'Open'}]}],issues:[{id:'ISS-201',title:'Webhook retry behavior',category:'Bug',status:'Open'},{id:'ISS-202',title:'Add export for mission logs',category:'Feature Request',status:'Open'}],docs:[{name:'Solution Architecture.pdf',type:'PDF'},{name:'UAT Checklist.docx',type:'DOC'}],updates:[{at:'2026-08-15T09:20',author:'Maya',raw:'API integration is 70% complete. We found one webhook retry issue and will retest tomorrow.',status:'In progress',summary:'API integration reached 70%; webhook retry issue remains open.',tags:['API','Blocked risk'],confidence:94},{at:'2026-08-13T16:10',author:'Aarav',raw:'Kickoff and solution design are signed off. Moving into implementation.',status:'Done',summary:'Discovery and solution design completed.',tags:['Milestone complete'],confidence:98}]},
{id:'PRJ-102',name:'AeroFleet Control Room',customer:'AeroFleet',owners:['Rohan','Ishita'],status:'Blocked',health:'Risk',start:'2026-06-25',due:'2026-08-18',updated:'2026-08-08T12:15',milestones:[{id:'M4',name:'Platform Setup',due:'2026-07-10',tasks:[{id:'T7',name:'Tenant provisioned',owner:'Ishita',status:'Done'},{id:'T8',name:'SSO configuration',owner:'Rohan',status:'Done'}]},{id:'M5',name:'Integration',due:'2026-08-12',tasks:[{id:'T9',name:'Fleet API mapping',owner:'Rohan',status:'Blocked'},{id:'T10',name:'Data validation',owner:'Ishita',status:'Open'}]},{id:'M6',name:'Launch',due:'2026-08-18',tasks:[{id:'T11',name:'Go-live readiness',owner:'Rohan',status:'Open'}]}],issues:[{id:'ISS-203',title:'Customer SSO metadata mismatch',category:'Implementation',status:'Blocked'},{id:'ISS-204',title:'Clarify alert routing',category:'Question',status:'Open'}],docs:[{name:'Integration Mapping.xlsx',type:'XLSX'}],updates:[{at:'2026-08-08T12:15',author:'Rohan',raw:'We are blocked because the customer SSO metadata still does not match the expected configuration. Waiting for their IT team.',status:'Blocked',summary:'SSO metadata mismatch is blocking integration.',tags:['External dependency','Blocked'],confidence:99}]},
{id:'PRJ-103',name:'UrbanAir Pilot',customer:'UrbanAir',owners:['Neha'],status:'In progress',health:'Good',start:'2026-07-15',due:'2026-09-05',updated:'2026-08-14T17:30',milestones:[{id:'M7',name:'Pilot Planning',due:'2026-07-28',tasks:[{id:'T12',name:'Pilot scope approved',owner:'Neha',status:'Done'},{id:'T13',name:'Site survey',owner:'Neha',status:'Done'}]},{id:'M8',name:'Pilot Execution',due:'2026-08-30',tasks:[{id:'T14',name:'Configure missions',owner:'Neha',status:'In progress'},{id:'T15',name:'Run test flights',owner:'Kabir',status:'Open'}]}],issues:[{id:'ISS-205',title:'Question on geofence radius',category:'Question',status:'Open'}],docs:[{name:'Pilot Plan.pdf',type:'PDF'}],updates:[{at:'2026-08-14T17:30',author:'Neha',raw:'Site survey is complete. I am configuring the first set of missions today.',status:'In progress',summary:'Site survey complete; mission configuration underway.',tags:['Pilot'],confidence:97}]},
{id:'PRJ-104',name:'MetroParcel Expansion',customer:'MetroParcel',owners:['Maya','Kabir'],status:'On track',health:'Good',start:'2026-08-01',due:'2026-09-22',updated:'2026-08-15T08:40',milestones:[{id:'M9',name:'Onboarding',due:'2026-08-10',tasks:[{id:'T16',name:'Kickoff',owner:'Maya',status:'Done'},{id:'T17',name:'Access checklist',owner:'Kabir',status:'Done'}]},{id:'M10',name:'Configuration',due:'2026-09-05',tasks:[{id:'T18',name:'Site configuration',owner:'Kabir',status:'In progress'},{id:'T19',name:'User roles',owner:'Maya',status:'Open'}]}],issues:[{id:'ISS-206',title:'Request for extra admin role',category:'Feature Request',status:'Open'}],docs:[{name:'Onboarding Guide.pdf',type:'PDF'}],updates:[{at:'2026-08-15T08:40',author:'Kabir',raw:'Access is ready and site configuration has started. No blockers.',status:'On track',summary:'Access complete; configuration started with no blockers.',tags:['Onboarding'],confidence:99}]}
]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed; let currentProject=null; let currentTab='internal';
let apiVersion=null; let apiOnline=false; let saveTimer=null; let saveBusy=false;
async function api(path, options={}){const res=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options}); if(!res.ok){let e={};try{e=await res.json()}catch{};throw new Error(e.error||('HTTP '+res.status));} return res.status===204?null:res.json()}
async function hydrate(){try{const state=await api('/api/state');db=state.projects?state:state.data;apiVersion=state.version;apiOnline=true;localStorage.setItem(KEY,JSON.stringify(db));setConnection(true);render();}catch(e){apiOnline=false;setConnection(false);render();toast('Backend unavailable — using browser fallback');}}
async function save(){localStorage.setItem(KEY,JSON.stringify(db)); if(!apiOnline)return; clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{if(saveBusy)return;saveBusy=true;try{const r=await api('/api/state',{method:'PUT',headers:{'If-Match':String(apiVersion)},body:JSON.stringify({projects:db.projects})});apiVersion=r.version;apiOnline=true;setConnection(true);}catch(e){if(e.message.includes('State changed')){try{const fresh=await api('/api/state');db=fresh;apiVersion=fresh.version;localStorage.setItem(KEY,JSON.stringify(db));render();toast('Data changed elsewhere — latest version loaded');}catch(_){} }else{apiOnline=false;setConnection(false);toast('Could not save to backend; local copy kept.');}}finally{saveBusy=false;}},80)}
function setConnection(ok){const el=document.getElementById('apiStatus');if(el)el.innerHTML=ok?'<span style="color:#16a34a">●</span> Backend connected':'<span style="color:#d97706">●</span> Local fallback';}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function statusClass(s){return s==='Blocked'?'blocked':s==='Done'||s==='On track'?'on':s==='In progress'?'progress':s==='Review'?'review':'not'}
function initials(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function pct(p){let all=p.milestones.flatMap(m=>m.tasks),done=all.filter(t=>t.status==='Done').length;return all.length?Math.round(done/all.length*100):0}
function daysSince(d){return Math.floor((Date.now()-new Date(d))/86400000)}
function render(){renderOverview();renderProjects();renderKanban();renderActivity();renderInsights(); if(currentProject) renderDetail(currentProject.id);}
function nav(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+page).classList.add('active');document.getElementById('crumb').innerHTML='Workspace / <b>'+page[0].toUpperCase()+page.slice(1)+'</b>'}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function stats(){let total=db.projects.length, blocked=db.projects.filter(p=>p.status==='Blocked').length, done=db.projects.filter(p=>pct(p)===100).length, stale=db.projects.filter(p=>daysSince(p.updated)>7).length;return {total,blocked,done,stale}}
function renderOverview(){let s=stats();let rows=db.projects.map(p=>`<tr><td><button class="row-btn project-name" onclick="openDetail('${p.id}')">${esc(p.name)}</button><div class="sub">${esc(p.customer)} · ${p.id}</div></td><td><div class="avatars">${p.owners.map(o=>`<div class="avatar" title="${esc(o)}">${initials(o)}</div>`).join('')}</div></td><td><span class="status ${statusClass(p.status)}">${p.status}</span></td><td><div class="progressbar"><i style="width:${pct(p)}%"></i></div><div class="sub">${pct(p)}% complete</div></td><td><span class="${daysSince(p.updated)>7?'status blocked':'pill'}">${daysSince(p.updated)>7?'No movement':'Updated '+new Date(p.updated).toLocaleDateString()}</span></td></tr>`).join('');document.getElementById('page-overview').innerHTML=`<div class="hero"><div><h1>Good morning, delivery team ✦</h1><p>One clean view of every project, blocker and customer update.</p></div><button class="btn primary" onclick="openProjectModal()">+ Add project</button></div><div class="stats"><div class="stat"><div class="label">ACTIVE PROJECTS</div><div class="num">${s.total}</div><div class="delta">Live workspace</div></div><div class="stat"><div class="label">BLOCKED</div><div class="num">${s.blocked}</div><div class="delta" style="color:${s.blocked?'var(--red)':'var(--green)'}">${s.blocked?'Needs attention':'All clear'}</div></div><div class="stat"><div class="label">COMPLETED</div><div class="num">${s.done}</div><div class="delta">100% task completion</div></div><div class="stat"><div class="label">STALE UPDATES</div><div class="num">${s.stale}</div><div class="delta" style="color:${s.stale?'var(--amber)':'var(--green)'}">7+ days without movement</div></div></div><div class="grid"><div class="card"><div class="card-head"><h3>Projects at a glance</h3><button class="btn ghost" onclick="nav('projects')">View all</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Project</th><th>Owners</th><th>Status</th><th>Progress</th><th>Movement</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="card"><div class="card-head"><h3>Latest activity</h3><button class="btn ghost" onclick="nav('activity')">Open feed</button></div><div class="activity">${latestUpdates(5)}</div></div></div>`}
function latestUpdates(n){return db.projects.flatMap(p=>p.updates.map(u=>({...u,project:p.name,id:p.id}))).sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,n).map(u=>`<div class="activity-item"><div class="dot">↗</div><div><b>${esc(u.project)}</b><p>${esc(u.summary)}</p></div><div class="time">${new Date(u.at).toLocaleDateString()}</div></div>`).join('')||'<div class="empty">No activity yet.</div>'}
function renderProjects(){let q=(document.getElementById('globalSearch')?.value||'').toLowerCase();let list=db.projects.filter(p=>(p.name+' '+p.customer+' '+p.owners.join(' ')).toLowerCase().includes(q));document.getElementById('page-projects').innerHTML=`<div class="hero"><div><h1>Projects</h1><p>Edit the data, open any project, or create a new one.</p></div></div><div class="card"><div class="card-head"><h3>${list.length} projects</h3><span class="muted" style="font-size:11px">Changes save automatically in this browser</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Project</th><th>Owners</th><th>Status</th><th>Progress</th><th>Due</th><th>Actions</th></tr></thead><tbody>${list.map(p=>`<tr><td><button class="row-btn project-name" onclick="openDetail('${p.id}')">${esc(p.name)}</button><div class="sub">${esc(p.customer)}</div></td><td>${p.owners.map(o=>`<span class="pill">${esc(o)}</span>`).join(' ')}</td><td><span class="status ${statusClass(p.status)}">${p.status}</span></td><td>${pct(p)}%</td><td>${new Date(p.due).toLocaleDateString()}</td><td><button class="btn ghost" onclick="editProject('${p.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div></div>`}
function openDetail(id){currentProject=db.projects.find(p=>p.id===id);currentTab='internal';document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-detail').classList.add('active');document.getElementById('crumb').innerHTML='Workspace / <b>'+esc(currentProject.name)+'</b>';renderDetail(id)}
function renderDetail(id){let p=db.projects.find(x=>x.id===id);if(!p)return;let customer=currentTab==='customer';let visibleM=p.milestones.map(m=>{let tasks=customer?m.tasks.filter(t=>t.status!=='Blocked'):m.tasks;return `<div class="milestone"><div class="mile-top"><div><div class="mile-name">${esc(m.name)}</div><div class="sub">Due ${new Date(m.due).toLocaleDateString()}</div></div><span class="pill">${m.tasks.filter(t=>t.status==='Done').length}/${m.tasks.length} done</span></div>${tasks.map(t=>`<div class="task"><div class="check ${t.status==='Done'?'done':''}">${t.status==='Done'?'✓':''}</div><span>${esc(t.name)} <span class="owner">· ${esc(t.owner)}</span></span><span class="status ${statusClass(t.status)}">${customer&&t.status==='Blocked'?'At risk':t.status}</span></div>`).join('')||'<div class="sub" style="padding:12px 0 0 25px">No customer-visible tasks here.</div>'}</div>`}).join('');let issues=p.issues.map(i=>`<div class="issue"><span class="tag ${i.category.toLowerCase().replaceAll(' ','')}">${esc(i.category)}</span><div><b style="font-size:12px">${esc(i.title)}</b><div class="sub">${i.id} · ${esc(i.status)}</div></div><span class="pill">${i.status}</span></div>`).join('')||'<div class="empty">No linked issues.</div>';let updates=p.updates.slice().sort((a,b)=>new Date(b.at)-new Date(a.at)).map(u=>`<div class="feed-item"><div class="feed-top"><b>${esc(u.author)} · <span class="status ${statusClass(u.status)}">${esc(u.status)}</span></b><span class="time">${new Date(u.at).toLocaleString()}</span></div><p>${esc(u.summary)}</p><div class="structured"><span class="mini">AI confidence ${u.confidence}%</span>${u.tags.map(t=>`<span class="mini">#${esc(t)}</span>`).join('')}</div></div>`).join('');let docs=p.docs.map(d=>`<div class="doc"><div class="doc-icon">${esc(d.type.slice(0,3))}</div><div><b style="font-size:12px">${esc(d.name)}</b><div class="sub">Customer visible document</div></div></div>`).join('')||'<div class="empty">No documents.</div>';document.getElementById('page-detail').innerHTML=`<button class="back" onclick="nav('projects')">← Back to projects</button><div class="project-header"><div><div class="project-title"><h1>${esc(p.name)}</h1><span class="status ${statusClass(p.status)}">${esc(p.status)}</span></div><div class="meta"><span>Customer: <b>${esc(p.customer)}</b></span><span>Owners: <b>${esc(p.owners.join(', '))}</b></span><span>Due: <b>${new Date(p.due).toLocaleDateString()}</b></span><span>Progress: <b>${pct(p)}%</b></span></div></div><div class="actions"><button class="btn" onclick="editProject('${p.id}')">Edit project</button><button class="btn primary" onclick="openUpdateModal('${p.id}')">+ Add update</button></div></div><div class="tabs"><button class="tab ${!customer?'active':''}" onclick="switchView('internal')">Internal view</button><button class="tab ${customer?'active':''}" onclick="switchView('customer')">Customer view</button></div>${customer?`<div class="customer-banner"><div><b>Customer portal preview</b><br><small>Only customer-safe project state is surfaced here.</small></div><span>LIVE PREVIEW</span></div>`:''}<div class="detail-grid"><div><div class="card"><div class="card-head"><h3>Milestones & tasks</h3><button class="btn ghost" onclick="openTaskModal('${p.id}')">+ Task</button></div>${visibleM||'<div class="empty">No milestones yet.</div>'}</div><div class="card" style="margin-top:18px"><div class="card-head"><h3>Updates → structured status</h3><span class="pill">AI-style parser demo</span></div><div class="feed">${updates||'<div class="empty">No updates yet.</div>'}</div></div></div><div><div class="card"><div class="card-head"><h3>Issues</h3><button class="btn ghost" onclick="openIssueModal('${p.id}')">+ Issue</button></div>${issues}</div><div class="card" style="margin-top:18px"><div class="card-head"><h3>Document vault</h3><span class="pill">${customer?'Customer visible':'Internal + customer'}</span></div><div style="padding:14px">${docs}</div></div><div class="card" style="margin-top:18px"><div class="card-head"><h3>Project health</h3></div><div style="padding:18px"><div style="display:flex;justify-content:space-between;font-size:12px"><b>Task completion</b><b>${pct(p)}%</b></div><div class="progressbar" style="width:100%;margin-top:9px"><i style="width:${pct(p)}%"></i></div><div class="sub" style="margin-top:12px">Last movement ${daysSince(p.updated)} day${daysSince(p.updated)==1?'':'s'} ago · ${daysSince(p.updated)>7?'flagged stale':'healthy cadence'}</div></div></div></div></div>`}
function switchView(v){currentTab=v;renderDetail(currentProject.id)}
function renderKanban(){let cols=['Open','In progress','Blocked','Done'];let all=db.projects.flatMap(p=>p.milestones.flatMap(m=>m.tasks.map(t=>({...t,project:p.name}))));document.getElementById('page-kanban').innerHTML=`<div class="hero"><div><h1>Kanban</h1><p>See every delivery task across projects in one place.</p></div></div><div class="kanban">${cols.map(c=>`<div class="column"><h4>${c} <span class="pill">${all.filter(t=>t.status===c).length}</span></h4>${all.filter(t=>t.status===c).map(t=>`<div class="kcard"><b>${esc(t.name)}</b><p>${esc(t.project)}</p><span class="pill">${esc(t.owner)}</span></div>`).join('')||'<div class="empty">Nothing here ✦</div>'}</div>`).join('')}</div>`}
function renderActivity(){let all=db.projects.flatMap(p=>p.updates.map(u=>({...u,project:p.name,id:p.id}))).sort((a,b)=>new Date(b.at)-new Date(a.at));document.getElementById('page-activity').innerHTML=`<div class="hero"><div><h1>Activity feed</h1><p>Unstructured chat/email-style updates become timestamped project state.</p></div><button class="btn primary" onclick="openUpdateModal()">+ Ingest update</button></div><div class="card"><div class="activity">${all.map(u=>`<div class="activity-item"><div class="dot">AI</div><div><b>${esc(u.project)} · ${esc(u.author)}</b><p>${esc(u.summary)}</p><span class="status ${statusClass(u.status)}">${esc(u.status)}</span> ${u.tags.map(t=>`<span class="mini">#${esc(t)}</span>`).join(' ')}</div><div class="time">${new Date(u.at).toLocaleString()}</div></div>`).join('')||'<div class="empty">No activity.</div>'}</div></div>`}
function renderInsights(){document.getElementById('page-insights').innerHTML=`<div class="hero"><div><h1>AI project insights ✦</h1><p>Ask questions against the current project state. No real AI API required for this demo.</p></div></div><div class="query"><input id="nlq" placeholder="Try: which projects are blocked? / which projects are stale? / show progress for UrbanAir"/><button class="btn primary" onclick="askInsight()">Ask</button></div><div id="insightResult" class="card" style="margin-top:18px"><div class="empty">Ask a question to generate an answer from your live local data.</div></div>`}
function askInsight(){let q=(document.getElementById('nlq').value||'').toLowerCase(), r='';if(q.includes('blocked')){let ps=db.projects.filter(p=>p.status==='Blocked');r=`<b>${ps.length} project${ps.length===1?' is':'s are'} blocked.</b><p>${ps.map(p=>esc(p.name)).join(', ')||'None'}.</p>`}else if(q.includes('stale')||q.includes('no status')){let ps=db.projects.filter(p=>daysSince(p.updated)>7);r=`<b>${ps.length} project${ps.length===1?' has':'s have'} no movement for 7+ days.</b><p>${ps.map(p=>esc(p.name)+' · '+daysSince(p.updated)+' days').join('<br>')||'Everything is moving.'}</p>`}else if(q.includes('behind')||q.includes('risk')){let ps=db.projects.filter(p=>p.status==='Blocked'||daysSince(p.updated)>7);r=`<b>${ps.length} projects need attention.</b><p>${ps.map(p=>esc(p.name)+' — '+esc(p.status)).join('<br>')||'No obvious risks.'}</p>`}else{let p=db.projects.find(x=>q.includes(x.name.toLowerCase())||q.includes(x.customer.toLowerCase()));r=p?`<b>${esc(p.name)} is ${esc(p.status)} at ${pct(p)}% completion.</b><p>Due ${new Date(p.due).toLocaleDateString()} · Owners: ${esc(p.owners.join(', '))} · Last update ${daysSince(p.updated)} day(s) ago.</p>`:`<b>I can answer:</b><p>blocked projects, stale projects, projects behind/risk, or progress for a named project.</p>`}document.getElementById('insightResult').innerHTML=`<div style="padding:20px;line-height:1.6;font-size:13px">${r}</div>`}
function openModal(title,body,saveLabel,saveFn){document.getElementById('modalBox').innerHTML=`<div class="modal-head"><b>${title}</b><button class="btn" onclick="closeModal()">✕</button></div><div class="modal-body">${body}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="modalSave">${saveLabel}</button></div>`;document.getElementById('modal').classList.add('show');document.getElementById('modalSave').onclick=saveFn}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openProjectModal(existing){let p=existing?db.projects.find(x=>x.id===existing):null;openModal(p?'Edit project':'New project',`<div class="field"><label>Project name</label><input id="fName" value="${esc(p?.name||'')}" placeholder="e.g. Acme rollout"/></div><div class="field"><label>Customer</label><input id="fCustomer" value="${esc(p?.customer||'')}" placeholder="Customer name"/></div><div class="field"><label>Owners (comma separated)</label><input id="fOwners" value="${esc(p?.owners?.join(', ')||'Aarav')}"/></div><div class="field"><label>Status</label><select id="fStatus"><option ${p?.status==='On track'?'selected':''}>On track</option><option ${p?.status==='In progress'?'selected':''}>In progress</option><option ${p?.status==='Blocked'?'selected':''}>Blocked</option><option ${p?.status==='Done'?'selected':''}>Done</option></select></div><div class="field"><label>Due date</label><input id="fDue" type="date" value="${p?.due||''}"/></div>`,p?'Save changes':'Create project',()=>{let name=document.getElementById('fName').value.trim();if(!name)return toast('Project name is required');let obj={id:p?.id||'PRJ-'+(101+db.projects.length),name,customer:document.getElementById('fCustomer').value.trim()||name,owners:document.getElementById('fOwners').value.split(',').map(x=>x.trim()).filter(Boolean),status:document.getElementById('fStatus').value,health:'Good',start:p?.start||new Date().toISOString().slice(0,10),due:document.getElementById('fDue').value||'2026-12-31',updated:p?.updated||new Date().toISOString(),milestones:p?.milestones||[],issues:p?.issues||[],docs:p?.docs||[],updates:p?.updates||[]};if(p)db.projects=db.projects.map(x=>x.id===p.id?obj:x);else db.projects.push(obj);save();closeModal();render();toast(p?'Project updated':'Project created');if(!p)openDetail(obj.id)})}
function editProject(id){openProjectModal(id)}
function openUpdateModal(projectId){let p=projectId?db.projects.find(x=>x.id===projectId):db.projects[0];openModal('Ingest unstructured update',`<div class="field"><label>Project</label><select id="uProject">${db.projects.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Author</label><input id="uAuthor" value="${esc(p.owners[0]||'Team')}"/></div><div class="field"><label>Paste a chat/email-style update</label><textarea id="uText" placeholder="API integration is 80% complete. We found one bug and will retest tomorrow."></textarea></div><div class="field"><label>Optional tags</label><input id="uTags" placeholder="API, customer, risk"/></div>`, 'Parse & add',()=>{let target=db.projects.find(x=>x.id===document.getElementById('uProject').value), raw=document.getElementById('uText').value.trim();if(!raw)return toast('Paste an update first');let low=raw.toLowerCase();let status=low.includes('block')||low.includes('waiting')||low.includes('stuck')?'Blocked':low.includes('complete')||low.includes('done')||low.includes('signed off')?'Done':'In progress';let summary=raw.replace(/\s+/g,' ').slice(0,170);let tags=(document.getElementById('uTags').value||'').split(',').map(x=>x.trim()).filter(Boolean);if(!tags.length)tags=status==='Blocked'?['Blocked risk']:['Delivery update'];target.updates.unshift({at:new Date().toISOString(),author:document.getElementById('uAuthor').value||'Team',raw,status,summary,tags,confidence:Math.min(99,88+Math.floor(Math.random()*11))});target.status=status==='Blocked'?'Blocked':target.status==='Blocked'?'In progress':target.status;target.updated=new Date().toISOString();save();closeModal();render();toast('Update parsed into structured status');if(currentProject&&currentProject.id===target.id)renderDetail(target.id)})}
function openIssueModal(id){let p=db.projects.find(x=>x.id===id);openModal('Link issue',`<div class="field"><label>Issue title</label><input id="iTitle" placeholder="Describe the issue"/></div><div class="field"><label>Category</label><select id="iCat"><option>Bug</option><option>Feature Request</option><option>Question</option><option>Support</option><option>Implementation</option></select></div><div class="field"><label>Status</label><select id="iStatus"><option>Open</option><option>Blocked</option><option>Done</option></select></div>`,`Add issue`,()=>{let title=document.getElementById('iTitle').value.trim();if(!title)return toast('Issue title is required');p.issues.push({id:'ISS-'+(200+p.issues.length+Math.floor(Math.random()*500)),title,category:document.getElementById('iCat').value,status:document.getElementById('iStatus').value});save();closeModal();render();renderDetail(p.id);toast('Issue linked')})}
function openTaskModal(id){let p=db.projects.find(x=>x.id===id);let opts=p.milestones.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');openModal('Add task',`<div class="field"><label>Milestone</label><select id="tMile">${opts||'<option value="">Create a milestone first</option>'}</select></div><div class="field"><label>Task</label><input id="tName" placeholder="Task name"/></div><div class="field"><label>Owner</label><input id="tOwner" value="${esc(p.owners[0]||'')}"/></div>`,`Add task`,()=>{let m=p.milestones.find(x=>x.id===document.getElementById('tMile').value),name=document.getElementById('tName').value.trim();if(!m||!name)return toast('Choose a milestone and task name');m.tasks.push({id:'T-'+Date.now(),name,owner:document.getElementById('tOwner').value||p.owners[0]||'Team',status:'Open'});save();closeModal();render();renderDetail(p.id);toast('Task added')})}
async function seedReset(){if(!confirm('Reset all demo data? Your edits will be removed.'))return;try{const r=await api('/api/reset',{method:'POST'});db=r;apiVersion=r.version;localStorage.setItem(KEY,JSON.stringify(db));setConnection(true);render();toast('Demo data reset')}catch(e){db=JSON.parse(JSON.stringify(seed));await save();render();toast('Demo data reset locally')}}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
document.getElementById('globalSearch').addEventListener('input',()=>{renderProjects(); if(document.getElementById('page-projects').classList.contains('active')){}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});hydrate();
</script>
</body></html>
